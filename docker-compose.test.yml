services:
  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: quota_test
      POSTGRES_PASSWORD: quota_test
      POSTGRES_DB: quota_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quota_test -d quota_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgres://quota_test:quota_test@test-db:5432/quota_test
    depends_on:
      test-db:
        condition: service_healthy
